<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Photos — Seori Self Photo Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    header { text-align: center; margin-bottom: 2rem; }
    .studio { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: #888; margin-top: 4px; }
    .divider { width: 40px; height: 1px; background: #ddd; margin: 1.5rem auto; }

    /* Loading state */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 0;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #eee;
      border-top: 3px solid #1a1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; color: #555; }
    .loading-sub { font-size: 12px; color: #aaa; }

    /* Photos state */
    #photos { display: none; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 420px; }
    h1 { font-size: 16px; font-weight: 400; color: #555; text-align: center; margin-bottom: 2rem; letter-spacing: 0.05em; display: none; }

    .photo-card { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
    .photo-card .preview {
      width: 100%; aspect-ratio: 5/7;
      background: #f0f0f0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .photo-card .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-card .card-body { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .photo-card .label { font-size: 13px; color: #888; letter-spacing: 0.05em; }
    .btn-download {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1a1a1a; color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; text-decoration: none; cursor: pointer;
    }
    .btn-download svg { width: 14px; height: 14px; }
    footer { margin-top: 3rem; text-align: center; font-size: 11px; color: #bbb; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="studio">seori</div>
    <div class="tagline">Self Photo Studio</div>
  </header>
  <div class="divider"></div>

  <!-- Loading screen -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Preparing your photos...</div>
    <div class="loading-sub">This will only take a moment</div>
  </div>

  <!-- Photos (shown after load) -->
  <h1 id="ready-title">Your photos are ready</h1>
  <div id="photos">

    <div class="photo-card">
      <div class="preview">
        <img id="img-bordered"
          src="https://lh3.googleusercontent.com/d/1XsXQiaemfj0HvQNeAwqCOSnmEvBzp5j3"
          alt="Photo with border"
        />
      </div>
      <div class="card-body">
        <span class="label">With border</span>
        <a class="btn-download" href="https://drive.google.com/uc?export=download&id=1XsXQiaemfj0HvQNeAwqCOSnmEvBzp5j3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>
      </div>
    </div>

    <div class="photo-card">
      <div class="preview">
        <img id="img-raw"
          src="https://lh3.googleusercontent.com/d/18FpN9Fgh3pnn5Irsl-JYU8ID3vePH_Ty"
          alt="Photo without border"
        />
      </div>
      <div class="card-body">
        <span class="label">Without border</span>
        <a class="btn-download" href="https://drive.google.com/uc?export=download&id=18FpN9Fgh3pnn5Irsl-JYU8ID3vePH_Ty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>
      </div>
    </div>

  </div>

  <footer>seori self photo studio &nbsp;·&nbsp; thank you</footer>

  <script>
    // Check if images are loaded, retry every 3 seconds up to 2 minutes
    const MAX_WAIT = 120000;
    const INTERVAL = 3000;
    let elapsed = 0;

    function checkImages() {
      const img = document.getElementById('img-bordered');
      const testImg = new Image();
      testImg.onload = function() {
        // Image loaded successfully — show photos
        document.getElementById('loading').style.display = 'none';
        document.getElementById('ready-title').style.display = 'block';
        document.getElementById('photos').style.display = 'flex';
      };
      testImg.onerror = function() {
        // Not ready yet — retry
        elapsed += INTERVAL;
        if (elapsed < MAX_WAIT) {
          setTimeout(checkImages, INTERVAL);
        } else {
          // Timeout — show photos anyway
          document.getElementById('loading').style.display = 'none';
          document.getElementById('ready-title').style.display = 'block';
          document.getElementById('photos').style.display = 'flex';
        }
      };
      testImg.src = img.src + '&t=' + Date.now(); // cache bust
    }

    // Start checking immediately
    checkImages();
  </script>

</body>
</html>
