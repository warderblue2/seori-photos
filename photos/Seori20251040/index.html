<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Photos — Seori Self Photo Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header .studio {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header .tagline {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888;
      margin-top: 4px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #ddd;
      margin: 1.5rem auto;
    }

    h1 {
      font-size: 16px;
      font-weight: 400;
      color: #555;
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .photos {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 420px;
    }

    .photo-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo-card img {
      width: 100%;
      display: block;
      aspect-ratio: 5/7;
      object-fit: cover;
      background: #f0f0f0;
    }

    .photo-card .card-body {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-card .label {
      font-size: 13px;
      color: #888;
      letter-spacing: 0.05em;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-download:hover { background: #333; }

    .btn-download svg {
      width: 14px;
      height: 14px;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="studio">seori</div>
    <div class="tagline">Self Photo Studio</div>
  </header>

  <div class="divider"></div>

  <h1>Your photos are ready</h1>

  <div class="photos">

    <!-- Bordered version -->
    <div class="photo-card">
      <img src="https://drive.google.com/uc?export=view&id=1mbA0cAp2My26uaIY5AFXCApRH-NsFtIF" alt="Photo with border"/>
      <div class="card-body">
        <span class="label">With border</span>
        <a class="btn-download" href="https://drive.google.com/uc?export=download&id=1mbA0cAp2My26uaIY5AFXCApRH-NsFtIF" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>
      </div>
    </div>

    <!-- Raw version -->
    <div class="photo-card">
      <img src="https://drive.google.com/uc?export=view&id=1S5SeoXY45g7Sk3RKQHPgv4n3eH0zmjzS" alt="Photo without border"/>
      <div class="card-body">
        <span class="label">Without border</span>
        <a class="btn-download" href="https://drive.google.com/uc?export=download&id=1S5SeoXY45g7Sk3RKQHPgv4n3eH0zmjzS" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>
      </div>
    </div>

  </div>

  <footer>seori self photo studio &nbsp;·&nbsp; thank you</footer>

</body>
</html>
